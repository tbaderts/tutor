grammar: |
  ## Saying what hurts

  Literally *"it does me harm"* — the body part is the subject, so the verb agrees with it:

  - one thing: **Mi fa male** + singular — *Mi fa male **il** ginocchio.*
  - more than one: **Mi fanno male** + plural — *Mi fanno male **le** gambe.*

  Note: Italian says ***il** ginocchio* (the knee), not *my knee*.

  For common aches: **Ho mal di** + body part — *Ho mal di testa, Ho mal di schiena.*

  ## Irregular plurals

  Some body parts become feminine in the plural:

  | singular | plural |
  |---|---|
  | il braccio | **le braccia** |
  | il ginocchio | **le ginocchia** |
  | il dito (finger) | **le dita** |
  | la mano | **le mani** |

  ## *dovere* (must, to have to)

  **devo**, devi, deve, dobbiamo, dovete, devono + infinitive: *Devo riposare.*

dialogue:
  title: The day after the race
  speakers:
    Davide: male
  lines:
    - speaker: Davide
      text: Come stai dopo la gara?
      en: How are you after the race?
    - speaker: you
      text: Così così. Mi fa male il ginocchio.
      en: So-so. My knee hurts.
    - speaker: Davide
      text: Ti fanno male anche le gambe?
      en: Do your legs hurt too?
    - speaker: you
      text: Sì, un po'. E ho mal di schiena.
      en: Yes, a bit. And I have back pain.
    - speaker: Davide
      text: Devi riposare! Metti un po' di ghiaccio.
      en: You have to rest! Put some ice on it.
    - speaker: you
      text: Hai ragione. Domani niente allenamento.
      en: You're right. No training tomorrow.

